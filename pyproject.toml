[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=cli --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
